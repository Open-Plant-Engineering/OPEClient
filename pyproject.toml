[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyopeclient"
version = "0.1.0"
description = "Session-based DB editing and search engine (CAD/PLM style)"
authors = [{name = "Shivang Kheradiya"}]
requires-python = ">=3.10"

dependencies = [
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "watchfiles"
]

[project.urls]
Homepage = "https://github.com/Open-Plant-Engineering/OPEClient"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/pyopeclient/grpc"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]